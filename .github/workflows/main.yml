name: Build Resolutions EXE

on:
  push:
    branches: [ clean-resolutions ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install selenium openpyxl pyinstaller pyautogui pywinauto

    # Onefile: один asud_resolutions.exe. KAV ругается одинаково на
    # onedir и onefile (поведенческий детектор), смысла дробить нет.
    - name: Build EXE (onefile)
      run: >
        pyinstaller --onefile --name asud_resolutions
        --add-data "addresses.csv;."
        --hidden-import=selenium.webdriver.edge.webdriver
        --hidden-import=selenium.webdriver.edge.service
        --hidden-import=selenium.webdriver.edge.options
        --hidden-import=selenium.webdriver.common.action_chains
        --hidden-import=selenium.webdriver.support.ui
        --hidden-import=selenium.webdriver.support.expected_conditions
        --hidden-import=openpyxl
        --hidden-import=pyautogui
        --hidden-import=pywinauto
        --hidden-import=xlsx_lock
        --hidden-import=xlsx_status
        --hidden-import=config
        --hidden-import=ui
        --hidden-import=correspondent
        --collect-submodules=openpyxl
        resolutions.py

    # Складываем exe + батники в одну плоскую папку и пакуем в ZIP.
    - name: Stage release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist\release -Force | Out-Null
        Copy-Item dist\asud_resolutions.exe dist\release\
        Copy-Item asud_resolutions_headless.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_resolutions_okrug.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_resolutions_zhkh.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_resolutions_okrug_watch.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_resolutions_zhkh_watch.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item config.json.example dist\release\ -ErrorAction SilentlyContinue

    - name: Zip release
      shell: pwsh
      run: |
        Compress-Archive -Path dist/release/* -DestinationPath dist/asud_resolutions.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: asud_resolutions
        path: dist/asud_resolutions.zip
