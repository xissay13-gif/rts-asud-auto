name: Build АСУД EXE

on:
  push:
    branches: [ main, background-mode, email-direct, email-daemon, email-zhkh ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install selenium openpyxl pyinstaller extract-msg colorama

    # Onedir вместо onefile: exe не распаковывает себя в %TEMP% при запуске,
    # KAV почти не срабатывает с PDM:Trojan.Win32.Generic. --noupx — без
    # UPX-упаковки (тоже триггер для AV). Структура:
    #   dist/registration/
    #     registration.exe
    #     _internal/  (DLL и Python-runtime)
    - name: Build EXE (onedir)
      run: >
        pyinstaller --onedir --name registration --noupx
        --add-data "addresses.csv;."
        --hidden-import=selenium.webdriver.edge.webdriver
        --hidden-import=selenium.webdriver.edge.service
        --hidden-import=selenium.webdriver.edge.options
        --hidden-import=selenium.webdriver.common.action_chains
        --hidden-import=selenium.webdriver.support.ui
        --hidden-import=selenium.webdriver.support.expected_conditions
        --hidden-import=openpyxl
        --hidden-import=extract_msg
        --hidden-import=colorama
        --hidden-import=shared.config
        --hidden-import=shared.ui
        --hidden-import=shared.correspondent
        --hidden-import=shared.attachments
        --hidden-import=shared.okrug_parser
        --hidden-import=shared.colors
        --hidden-import=shared.classifier
        --hidden-import=shared.zhkh_parser
        --hidden-import=shared.feedback_parser
        --hidden-import=shared.asud_resolution
        --hidden-import=flows.mix
        --hidden-import=flows.auto_create
        --hidden-import=flows.smart
        --hidden-import=flows.email
        --hidden-import=flows.zhkh_daemon
        --hidden-import=shared.xlsx_lock
        --hidden-import=shared.xlsx_status
        app.py

    # Копируем launchers и template настроек прямо в папку registration/
    # — чтобы пользователь после распаковки ZIP мог сразу запускать .bat
    # из той же папки где лежит registration.exe.
    - name: Copy launchers + settings template
      shell: pwsh
      run: |
        Copy-Item asud_headless.bat dist\registration\ -ErrorAction SilentlyContinue
        Copy-Item asud_email_watch.bat dist\registration\ -ErrorAction SilentlyContinue
        Copy-Item asud_auto_create_headless.bat dist\registration\ -ErrorAction SilentlyContinue
        Copy-Item asud_zhkh_daemon.bat dist\registration\ -ErrorAction SilentlyContinue
        Copy-Item settings.json.example dist\registration\ -ErrorAction SilentlyContinue

    - name: Zip dist folder
      shell: pwsh
      run: |
        Compress-Archive -Path dist/registration/* -DestinationPath dist/registration.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: registration
        path: dist/registration.zip
