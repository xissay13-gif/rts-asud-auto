name: Build АСУД EXE

on:
  push:
    branches: [ main, background-mode, email-direct, email-daemon, email-zhkh ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install selenium openpyxl pyinstaller extract-msg colorama

    # Onefile: один asud.exe + батники. KAV ругается одинаково
    # на onedir и onefile (поведенческий детектор), так что смысла дробить
    # на папку нет — храним удобный single-exe.
    - name: Build EXE (onefile)
      run: >
        pyinstaller --onefile --name asud
        --add-data "addresses.csv;."
        --hidden-import=selenium.webdriver.edge.webdriver
        --hidden-import=selenium.webdriver.edge.service
        --hidden-import=selenium.webdriver.edge.options
        --hidden-import=selenium.webdriver.common.action_chains
        --hidden-import=selenium.webdriver.support.ui
        --hidden-import=selenium.webdriver.support.expected_conditions
        --hidden-import=openpyxl
        --hidden-import=extract_msg
        --hidden-import=colorama
        --hidden-import=shared.config
        --hidden-import=shared.ui
        --hidden-import=shared.correspondent
        --hidden-import=shared.attachments
        --hidden-import=shared.okrug_parser
        --hidden-import=shared.colors
        --hidden-import=shared.classifier
        --hidden-import=shared.zhkh_parser
        --hidden-import=shared.feedback_parser
        --hidden-import=shared.deadline
        --hidden-import=shared.asud_resolution
        --hidden-import=flows.mix
        --hidden-import=flows.auto_create
        --hidden-import=flows.smart
        --hidden-import=flows.email
        --hidden-import=flows.zhkh_daemon
        --hidden-import=shared.xlsx_lock
        --hidden-import=shared.xlsx_status
        app.py

    # Складываем exe + .bat + settings template в одну плоскую папку,
    # пакуем в ZIP. Пользователь распаковывает → всё рядом.
    - name: Stage release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path dist\release -Force | Out-Null
        Copy-Item dist\asud.exe dist\release\
        Copy-Item asud_headless.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_email_watch.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_auto_create_headless.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item asud_zhkh_daemon.bat dist\release\ -ErrorAction SilentlyContinue
        Copy-Item settings.json.example dist\release\ -ErrorAction SilentlyContinue

    - name: Zip release
      shell: pwsh
      run: |
        Compress-Archive -Path dist/release/* -DestinationPath dist/asud.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: asud
        path: dist/asud.zip
